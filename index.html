<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manutec — Visão geral</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e5ae3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*,::before,::after{margin:0;border:0 solid}html{line-height:1.5;-webkit-text-size-adjust:100%}button,input{color:inherit;background:transparent;border-radius:0;padding:0}button{text-align:inherit}img,svg{display:block;max-width:100%}p{margin:0}
:root {
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #f3f0e8;
  background: #0c0c0b;
  font-synthesis: none;
  --gold: #e5ae3d;
  --gold-light: #f3cb75;
  --gold-dark: #9d7020;
  --ink: #0c0c0b;
  --panel: #161615;
  --panel-soft: #1b1b19;
  --line: #2d2c29;
  --muted: #8c8981;
  --cream: #f3f0e8;
}

html {
  color-scheme: dark;
}

html[data-theme="light"] {
  color-scheme: light;
  --gold: #b77b13;
  --gold-light: #d69a2c;
  --gold-dark: #94600a;
  --ink: #171611;
  --panel: #ffffff;
  --panel-soft: #f5f2ea;
  --line: #ded9cd;
  --muted: #777269;
  --cream: #1c1b17;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 84% 3%, rgba(229, 174, 61, 0.07), transparent 24rem),
    #0c0c0b;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  min-height: 100vh;
  display: flex;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: 248px;
  display: flex;
  flex-direction: column;
  padding: 30px 20px 22px;
  background: #111110;
  border-right: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 7px 34px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  transform: skew(-8deg);
  color: #111110;
  background: linear-gradient(145deg, var(--gold-light), var(--gold));
  box-shadow: 0 8px 24px rgba(229, 174, 61, 0.13);
}

.brand-mark span {
  transform: skew(8deg);
  font: 800 23px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.brand-name {
  letter-spacing: 0.12em;
  font: 800 18px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.brand-caption {
  margin-top: 5px;
  color: var(--gold);
  letter-spacing: 0.13em;
  font: 700 7px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.nav-label {
  padding: 0 13px 12px;
  color: #5e5c56;
  letter-spacing: 0.16em;
  font-size: 9px;
  font-weight: 700;
}

.nav-list {
  display: grid;
  gap: 5px;
}

.nav-item {
  position: relative;
  width: 100%;
  height: 47px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 13px;
  color: #898780;
  background: transparent;
  border: 0;
  border-radius: 9px;
  text-align: left;
  transition: 180ms ease;
}

.nav-item:hover {
  color: var(--cream);
  background: rgba(255, 255, 255, 0.035);
}

.nav-item.active {
  color: var(--gold-light);
  background: linear-gradient(90deg, rgba(229, 174, 61, 0.14), rgba(229, 174, 61, 0.04));
}

.nav-item.active i {
  position: absolute;
  right: -20px;
  width: 3px;
  height: 25px;
  border-radius: 4px 0 0 4px;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(229, 174, 61, 0.5);
}

.sidebar-bottom {
  margin-top: auto;
}

.support-card {
  margin-top: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px;
  background: #181817;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.support-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  color: var(--gold);
  background: rgba(229, 174, 61, 0.09);
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
}

.support-card strong,
.support-card span {
  display: block;
}

.support-card strong {
  color: #d9d5cb;
  font-size: 10px;
}

.support-card div span {
  margin-top: 3px;
  color: #6e6b65;
  font-size: 9px;
}

.support-card .online-dot {
  width: 6px;
  height: 6px;
  margin-left: auto;
  border-radius: 50%;
  background: #57c779;
  box-shadow: 0 0 8px #57c779;
}

.main {
  width: calc(100% - 248px);
  margin-left: 248px;
}

.topbar {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  background: rgba(12, 12, 11, 0.82);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
}

.topbar-left,
.topbar-actions {
  display: flex;
  align-items: center;
}

.eyebrow {
  color: var(--gold);
  letter-spacing: 0.17em;
  font-size: 8px;
  font-weight: 800;
}

.page-title {
  margin-top: 6px;
  font: 700 20px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.topbar-actions {
  gap: 10px;
}

.search {
  width: 255px;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  color: #74716b;
  background: #151514;
  border: 1px solid var(--line);
  border-radius: 9px;
}

.search input {
  min-width: 0;
  flex: 1;
  color: var(--cream);
  background: transparent;
  border: 0;
  outline: none;
  font-size: 11px;
}

.search input::placeholder {
  color: #65635e;
}

.search kbd {
  color: #66635d;
  font-size: 9px;
}

.icon-button,
.mobile-menu,
.sidebar-close {
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: #a6a39c;
  background: #151514;
  border: 1px solid var(--line);
  border-radius: 9px;
}

.icon-button > span {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 5px;
  height: 5px;
  background: var(--gold);
  border-radius: 50%;
}

.theme-toggle {
  overflow: hidden;
}

.theme-toggle svg {
  transition: transform 220ms ease;
}

.theme-toggle:hover svg {
  transform: rotate(12deg);
}

.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: 4px;
  color: var(--cream);
  background: transparent;
  border: 0;
}

.avatar {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  color: #181713;
  background: linear-gradient(145deg, #f0c464, #b88327);
  border-radius: 50%;
  font-size: 11px;
  font-weight: 800;
}

.profile-copy {
  display: grid;
  gap: 3px;
  text-align: left;
}

.profile-copy strong {
  font-size: 10px;
}

.profile-copy span {
  color: #6c6963;
  font-size: 8px;
}

.chevron {
  color: #77746e;
}

.content {
  width: min(1190px, calc(100% - 64px));
  margin: 0 auto;
  padding: 28px 0 54px;
}

.hero {
  min-height: 272px;
  display: grid;
  grid-template-columns: 52% 48%;
  overflow: hidden;
  background:
    linear-gradient(100deg, rgba(25, 25, 23, 0.98) 0%, rgba(25, 25, 23, 0.93) 51%, rgba(18, 18, 17, 0.56) 100%);
  border: 1px solid #32312e;
  border-radius: 14px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
}

.hero-copy {
  position: relative;
  z-index: 2;
  padding: 39px 0 35px 42px;
}

.hero-kicker {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--gold);
  letter-spacing: 0.18em;
  font-size: 9px;
  font-weight: 800;
}

.hero-kicker span {
  width: 24px;
  height: 1px;
  background: var(--gold);
}

.hero-title {
  margin-top: 13px;
  color: #f6f2e9;
  letter-spacing: -0.035em;
  font: 700 35px/1.11 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.hero-title em {
  color: var(--gold-light);
  font-style: normal;
}

.hero-copy p {
  max-width: 470px;
  margin: 14px 0 21px;
  color: #918e86;
  font-size: 11px;
  line-height: 1.65;
}

.primary-button {
  height: 40px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  color: #17150f;
  background: linear-gradient(135deg, #f1c35d, #d89a28);
  border: 0;
  border-radius: 7px;
  box-shadow: 0 9px 25px rgba(229, 174, 61, 0.16);
  font-size: 10px;
  font-weight: 800;
  transition: 180ms ease;
}

.primary-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.hero-visual {
  position: relative;
  min-height: 270px;
  overflow: hidden;
}

.hero-visual::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(90deg, #191917 0%, rgba(25, 25, 23, 0.14) 38%, rgba(15, 15, 14, 0.08) 100%);
}

.hero-visual img {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  object-fit: cover;
  filter: saturate(0.72) contrast(1.04) brightness(0.8);
}

.hero-grid {
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0.1;
  background-image:
    linear-gradient(rgba(229, 174, 61, 0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(229, 174, 61, 0.35) 1px, transparent 1px);
  background-size: 34px 34px;
}

.fleet-badge {
  position: absolute;
  right: 22px;
  bottom: 21px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 11px 14px;
  background: rgba(13, 13, 12, 0.86);
  border: 1px solid rgba(229, 174, 61, 0.34);
  border-radius: 8px;
  backdrop-filter: blur(8px);
}

.fleet-badge div {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.fleet-badge strong {
  color: var(--gold-light);
  font: 700 19px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.fleet-badge span {
  color: #7b786f;
  letter-spacing: 0.08em;
  font-size: 7px;
  font-weight: 700;
}

.fleet-badge i {
  width: 1px;
  height: 19px;
  background: #383631;
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 14px;
}

.metric-card {
  position: relative;
  overflow: hidden;
  padding: 17px 18px 15px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.metric-card::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 2px;
  opacity: 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.metric-card:hover::after,
.metric-accent::after {
  opacity: 1;
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #8b8881;
  font-size: 10px;
}

.metric-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  color: var(--gold);
  background: rgba(229, 174, 61, 0.08);
  border-radius: 7px;
}

.metric-icon svg {
  width: 15px;
}

.metric-value {
  margin-top: 6px;
  font: 700 28px/1.1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.metric-change {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 7px;
  color: #6e6b64;
  font-size: 8px;
}

.metric-change > span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 14px;
  margin-top: 14px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 11px;
}

.panel-header {
  min-height: 67px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}

.panel-title {
  font: 700 13px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.panel-header p,
.section-heading p {
  margin: 6px 0 0;
  color: #6f6c65;
  font-size: 8px;
}

.text-button,
.outline-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--gold);
  background: transparent;
  border: 0;
  font-size: 9px;
  font-weight: 700;
}

.agenda-list {
  padding: 2px 20px 8px;
}

.agenda-item {
  min-height: 62px;
  display: grid;
  grid-template-columns: 72px 13px minmax(170px, 1fr) 115px 78px 24px;
  align-items: center;
  gap: 9px;
  border-bottom: 1px solid #292825;
}

.agenda-item:last-child {
  border-bottom: 0;
}

.agenda-time {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--gold);
}

.agenda-time strong {
  color: #d9d5cc;
  font-size: 10px;
}

.agenda-line {
  height: 28px;
  display: grid;
  place-items: center;
}

.agenda-line::before {
  content: "";
  width: 1px;
  height: 100%;
  background: #37352f;
}

.agenda-line span {
  width: 5px;
  height: 5px;
  position: absolute;
  background: var(--gold);
  border-radius: 50%;
}

.agenda-info,
.agenda-place {
  display: grid;
  gap: 4px;
}

.agenda-info strong {
  overflow: hidden;
  color: #cfcbc2;
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agenda-info span,
.agenda-place span {
  color: #6f6c65;
  font-size: 8px;
}

.agenda-place {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #76736c;
}

.status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 8px;
  font-weight: 700;
}

.status span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.status.route { color: #e0aa3c; }
.status.route span { background: #e0aa3c; box-shadow: 0 0 7px #e0aa3c; }
.status.confirmed { color: #70bd82; }
.status.confirmed span { background: #70bd82; }
.status.pending { color: #8b8881; }
.status.pending span { background: #8b8881; }

.row-action,
.fleet-copy button {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  color: #74716a;
  background: transparent;
  border: 1px solid #33312d;
  border-radius: 6px;
}

.more-button {
  color: #77746c;
  background: transparent;
  border: 0;
  letter-spacing: 0.2em;
}

.occupancy-body {
  min-height: 135px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 13px 15px 8px;
}

.donut {
  width: 105px;
  height: 105px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  background: conic-gradient(var(--gold) 0 var(--p1,51%), #f1eadb var(--p1,51%) var(--p2,94%), #4a4944 var(--p2,94%));
  border-radius: 50%;
  box-shadow: 0 0 23px rgba(229, 174, 61, 0.08);
}

.donut::before {
  content: "";
  width: 77px;
  height: 77px;
  position: absolute;
  background: var(--panel);
  border-radius: 50%;
}

.donut div {
  position: relative;
  z-index: 1;
  display: grid;
  text-align: center;
}

.donut strong {
  font: 700 20px/1 "Montserrat", system-ui, "Segoe UI", sans-serif;
}

.donut span {
  margin-top: 5px;
  color: #737068;
  font-size: 6px;
  font-weight: 700;
}

.legend {
  display: grid;
  gap: 11px;
}

.legend > div {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend > div > span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.legend .gold { background: var(--gold); }
.legend .cream { background: #f1eadb; }
.legend .gray { background: #4a4944; }

.legend p {
  display: grid;
  gap: 2px;
  margin: 0;
  color: #89867f;
  font-size: 8px;
}

.legend strong {
  color: #ccc8bf;
  font-size: 8px;
}

.occupancy-note {
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 20px;
  color: #7f9a7d;
  border-top: 1px solid var(--line);
  font-size: 8px;
}

.fleet-section {
  margin-top: 28px;
}

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 12px;
}

.outline-button {
  height: 32px;
  padding: 0 12px;
  color: #a6a299;
  border: 1px solid #36342f;
  border-radius: 7px;
}

.outline-button:hover {
  color: var(--gold);
  border-color: var(--gold-dark);
}

.fleet-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}

.fleet-card {
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: 200ms ease;
}

.fleet-card:hover {
  transform: translateY(-3px);
  border-color: #51462f;
}

.fleet-image {
  height: 126px;
  position: relative;
  overflow: hidden;
  background: #24231f;
}

.fleet-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 35%, rgba(12, 12, 11, 0.8));
}

.fleet-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(0.75) contrast(1.05);
  transition: 350ms ease;
}

.fleet-card:hover .fleet-image img {
  transform: scale(1.035);
}

.fleet-image > span {
  position: absolute;
  left: 12px;
  bottom: 10px;
  z-index: 1;
  padding: 5px 7px;
  color: var(--gold-light);
  background: rgba(12, 12, 11, 0.77);
  border: 1px solid rgba(229, 174, 61, 0.26);
  border-radius: 4px;
  font-size: 7px;
  font-weight: 700;
}

.fleet-image small {
  position: absolute;
  right: 8px;
  bottom: 7px;
  z-index: 1;
  color: rgba(255, 255, 255, 0.38);
  font-size: 5px;
}

.fleet-copy {
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 13px;
}

.fleet-copy > div {
  display: grid;
  gap: 7px;
}

.fleet-copy strong {
  color: #d8d4ca;
  font-size: 10px;
}

.fleet-copy span {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #74716b;
  font-size: 8px;
}

.fleet-copy span i {
  width: 5px;
  height: 5px;
  background: #64ad76;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(100, 173, 118, 0.7);
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 50;
  max-width: 360px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  color: #1b1914;
  background: var(--gold-light);
  border: 1px solid #f9dd9e;
  border-radius: 9px;
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
  font-size: 10px;
  font-weight: 700;
  animation: toast-in 220ms ease both;
}

.mobile-menu,
.sidebar-close,
.scrim {
  display: none;
}

html[data-theme="light"] body {
  color: #1c1b17;
  background:
    radial-gradient(circle at 84% 3%, rgba(183, 123, 19, 0.1), transparent 24rem),
    #f1eee6;
}

html[data-theme="light"] .sidebar {
  background: #fbfaf6;
  box-shadow: 8px 0 30px rgba(78, 61, 28, 0.04);
}

html[data-theme="light"] .brand-mark,

@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1100px) {
  .profile-copy,
  .chevron {
    display: none;
  }

  .content {
    width: calc(100% - 40px);
  }

  .agenda-item {
    grid-template-columns: 67px 10px minmax(150px, 1fr) 75px 24px;
  }

  .agenda-place {
    display: none;
  }

  .hero-title {
    font-size: 30px;
  }
}

@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform 220ms ease;
  }

  .sidebar-open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 34px;
    height: 34px;
    display: grid;
    margin-left: auto;
  }

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: block;
    background: rgba(0, 0, 0, 0.66);
    border: 0;
  }

  .main {
    width: 100%;
    margin-left: 0;
  }

  .mobile-menu {
    display: grid;
    margin-right: 13px;
  }

  .dashboard-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {
  .topbar {
    height: 74px;
    padding: 0 16px;
  }

  .search,
  .profile {
    display: none;
  }

  .content {
    width: calc(100% - 28px);
    padding-top: 14px;
  }

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-copy {
    padding: 30px 26px 26px;
  }

  .hero-title {
    font-size: 28px;
  }

  .hero-visual {
    min-height: 180px;
  }

  .hero-visual::before {
    background: linear-gradient(180deg, #191917 0%, transparent 55%);
  }

  .metrics-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .fleet-grid {
    grid-template-columns: 1fr;
  }

  .fleet-image {
    height: 175px;
  }

  .section-heading {
    align-items: flex-start;
    gap: 14px;
  }

  .outline-button {
    max-width: 150px;
    height: auto;
    padding: 8px 10px;
  }

  .agenda-item {
    grid-template-columns: 60px minmax(130px, 1fr) 72px 20px;
    gap: 6px;
  }

  .agenda-line {
    display: none;
  }
}

@media (max-width: 420px) {
  .metrics-grid {
    grid-template-columns: 1fr;
  }

  .agenda-list {
    padding-inline: 13px;
  }

  .agenda-item {
    grid-template-columns: 52px minmax(110px, 1fr) 20px;
  }

  .status {
    display: none;
  }

  .occupancy-body {
    gap: 18px;
  }
}
